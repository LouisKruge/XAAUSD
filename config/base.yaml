# Base configuration. Overridden by {env}.yaml then local.yaml then XAUUSD_* env vars.
# Values here are STARTING POINTS. Thresholds marked (validated) must be replaced with
# numbers produced by the Phase 10 validation run before any live deployment.

env: dev
mode: PAPER
live_trading: false
# The broker's own name for spot gold. This terminal shows "GOLD, M1: SPOT Gold
# Ounce vs US Dollar", so GOLD it is. Symbol DISCOVERY still runs at startup and is
# the runtime authority — it matches ^XAU or ^GOLD, keeps tradable USD instruments
# and checks the quote is in the bullion band, so a broker that calls it XAUUSD still
# works. This value is what the OFFLINE paths use, where there is no broker to ask:
# the backtest, the validation run and anything reading harvested history.
symbol: GOLD
log_level: INFO
log_json: true
decision_interval_seconds: 300

enabled_strategies:
  - sweep_mss_fvg
  - sweep_mss_ob

# The short-duration engine, running beside the A/A+ one on its own cadence.
#
# Enabled here so the bot scans and trades on start. What keeps that safe is NOT this
# switch: live money still needs mode=LIVE, live_trading=true and a machine-specific
# arming file matching the account, and g_strategy_validated refuses live routing for
# any strategy that has not passed out-of-sample validation. In PAPER and DEMO the
# scalp engine trades freely, which is the point - that is how it earns a record.
#
# Every threshold below is a STARTING POINT awaiting the out-of-sample sweep, not a
# validated value. min_score in particular is a guess.
scalp:
  enabled: true
  scan_interval_seconds: 2.0
  enabled_models:
    - scalp_sweep_reversal
    - scalp_fvg_retracement
    - scalp_ob_reaction
    - scalp_breakout_retest
    - scalp_momentum_continuation
  risk_pct: 0.0015            # 10 concurrent would be 1.50%, inside the 2% cap
  max_concurrent: 1           # raised only when the correlation gate is wired live
  max_cost_fraction: 0.35     # costs may not exceed 35% of 1R
  min_net_expectancy_r: 0.05  # positive by a margin, not by a rounding error
  assumed_win_probability: 0.55
  target_rr: 1.5
  min_gross_rr: 1.25          # below this a high win rate stops being worth having
  min_score: 65.0             # (validated) placeholder - sweep this first
  max_hold_minutes: 90
  min_stop_atr: 0.8
  max_stop_atr: 3.5

risk:
  risk_pct_a: 0.01
  risk_pct_a_plus: 0.02
  global_risk_cap_pct: 0.02        # lower this for Stage 6 (e.g. 0.0025)
  max_daily_drawdown_pct: 0.02
  max_weekly_drawdown_pct: 0.05
  max_monthly_drawdown_pct: 0.10
  max_total_open_risk_pct: 0.02
  max_concurrent_positions: 1
  max_trades_per_day: 3
  max_consecutive_losses_lockout: 4
  drawdown_from_peak: true
  daily_reset_hour_broker: 0
  weekly_lockout_needs_manual_clear: true
  monthly_lockout_needs_manual_clear: true
  margin_safety_factor: 0.30
  sizing_cross_check_tolerance: 0.02
  commission_per_lot: 7.0
  slippage_points_estimate: 15.0

execution:
  max_spread_points: 50.0
  max_spread_ratio: 2.5
  max_quote_age_seconds: 10.0
  max_bar_age_seconds: 420.0
  max_entry_drift_r: 0.15
  max_slippage_points: 25
  max_send_retries: 2
  require_server_side_stop: true
  break_even_at_r: 1.0
  break_even_offset_r: 0.05
  partial_tp_enabled: false
  trail_enabled: true
  trail_activate_r: 1.5
  time_stop_bars: 48
  time_stop_min_r: 0.3
  invalidation_exit_enabled: true
  flat_before_weekend: true

thresholds:                         # (validated) — placeholders until Phase 10
  a_score_min: 70.0
  a_plus_score_min: 85.0
  a_probability_min: 0.55
  a_plus_probability_min: 0.65
  a_strong_categories_min: 5
  a_plus_strong_categories_min: 7
  min_rr: 2.0
  preferred_rr: 3.0
  require_probability_model: false

scoring:                            # (validated) — validator enforces a total of exactly 100.
                                    # The brief's example totalled 95; the spare 5 points
                                    # are given to entry_confirmation.
  htf_bias: 15.0
  market_structure: 15.0
  liquidity: 15.0
  fvg_ob: 10.0
  support_resistance: 10.0
  fundamentals: 10.0
  dxy_yields: 5.0
  session: 5.0
  volatility_regime: 5.0
  entry_confirmation: 10.0

structure:
  swing_lookback: 2
  swing_min_atr: 0.25
  bos_min_displacement_atr: 0.5
  bos_min_body_ratio: 0.5
  bos_require_body_close: true
  mss_min_displacement_atr: 0.75
  atr_period: 14

liquidity:
  equal_level_tolerance_atr: 0.10
  min_equal_touches: 2
  sweep_min_penetration_atr: 0.05
  sweep_max_penetration_atr: 1.5
  sweep_min_rejection_ratio: 0.35
  sweep_max_bars_to_reject: 3
  sweep_require_close_back_inside: true
  displacement_after_sweep_atr: 0.5

fvg:
  min_size_atr: 0.15
  min_displacement_atr: 0.5
  mitigation_threshold: 0.5
  prefer_consequent_encroachment: true

order_block:
  require_bos: true
  min_displacement_atr: 0.6
  use_wick_extremes: true

session:
  # All sessions. The clock was only ever a proxy for the spread, and the spread is
  # measured directly: g_spread caps at max_spread_points, and the market-open /
  # weekday / week-edge checks in is_tradable_window are independent of this list, so
  # the weekend gap and the daily rollover break are still refused. Asian-session
  # trading is not free — it costs ~36% of 1R against ~24% in London — but that is a
  # per-bar economic judgement, not a calendar rule. See docs/specs/scalp-engine.md C.2.
  # "OFF" MUST stay quoted: YAML 1.1 parses a bare OFF as the boolean false, which
  # reaches pydantic as False and fails validation with a confusing enum error.
  allowed_sessions: [ASIA, LONDON, NEW_YORK, OVERLAP, "OFF"]
  allowed_weekdays: [0, 1, 2, 3, 4]
  block_first_minutes_of_week: 60
  block_last_minutes_of_week: 120

regime:
  strong_trend_adx: 30.0
  moderate_trend_adx: 20.0
  abnormal_atr_multiple: 3.0
  abnormal_spread_multiple: 4.0
  allowed_regimes: [STRONG_BULL, MODERATE_BULL, RANGE, MODERATE_BEAR, STRONG_BEAR]

news:
  blackout_minutes_before: {CRITICAL: 60, HIGH: 30, MEDIUM: 15, LOW: 0}
  blackout_minutes_after: {CRITICAL: 30, HIGH: 15, MEDIUM: 10, LOW: 0}
  require_spread_normalised_after: true
  max_macro_age_days: 3
  news_risk_blocks_a_plus: HIGH
  news_risk_blackout: EXTREME
  max_news_score_contribution: 4.0
  llm_enabled: false

data:
  synthetic_dxy: true
  lake_path: data/lake
  # M1 is the scalp engine's trigger timeframe. 3000 bars is ~2 days of M1, enough
  # for micro structure with the ATR warm-up cleared.
  bars_to_load:
    M1: 3000
    M5: 1500
    M15: 1000
    H1: 800
    H4: 500
    D1: 400
    W1: 200

broker:
  kind: sim
  magic: 20260831

database:
  url: sqlite:///data/xauusd.db

alerts:
  min_level: WARNING
