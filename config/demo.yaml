env: demo
mode: DEMO
broker:
  kind: mt5_grpc
  bridge_address: 127.0.0.1:50551
database:
  # SQLite by default so demo trading needs nothing installed. Setup points this at
  # PostgreSQL (via XAUUSD_DATABASE__URL in .env) when it has actually started one.
  # Requiring Postgres here made demo mode impossible without Docker, which is not a
  # dependency demo trading against an MT5 demo account actually has.
  url: sqlite:///data/xauusd_demo.db
alerts:
  telegram_enabled: true
