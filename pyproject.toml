[project]
name = "xauusd-trading-system"
version = "0.1.0"
description = "Selective XAUUSD trading intelligence and execution system for MetaTrader 5"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "SQLAlchemy>=2.0.30",
    "alembic>=1.13",
    "structlog>=24.1",
    "httpx>=0.27",
    "python-dateutil>=2.9",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
db = ["psycopg[binary]>=3.1", "asyncpg>=0.29", "redis>=5.0"]
ml = ["scikit-learn>=1.4", "lightgbm>=4.3"]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "websockets>=12.0"]
mt5 = ["MetaTrader5>=5.0.45", "grpcio>=1.62", "grpcio-tools>=1.62", "protobuf>=4.25"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "hypothesis>=6.100", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
xauusd = "xauusd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xauusd"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF012"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["xauusd.dashboard.*", "xauusd.ml.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
